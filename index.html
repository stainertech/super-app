
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>MyWallet - Demo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #ffffff;
}

.container {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* TOP WHITE SECTION */

.top-section {
    flex: 1 0 auto;
    min-height: 410px;
    background: #ffffff;
    padding: 0 22px 65px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    margin-top: clamp(55px, 11vh, 100px);
    margin-bottom: 35px;
    font-size: 35px;
    font-weight: bold;
    letter-spacing: -1px;
}

.logo span:first-child {
    color: #2472b9;
}

.logo span:last-child {
    color: #d64c58;
}

h3 {
    color: #555555;
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 30px;
}

/* PHONE FIELD */

.phone-box {
    width: 100%;
    height: 54px;
    border: 1.5px solid #8799aa;
    border-radius: 7px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
}

.phone-box select {
    width: 90px;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #666666;
    font-size: 13px;
    cursor: pointer;
}

.phone-box input {
    flex: 1;
    width: 0;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: #333333;
}

.phone-box input::placeholder {
    color: #999999;
}

/* PIN SECTION */

.hint {
    color: #888888;
    font-size: 13px;
    margin-top: 22px;
    margin-bottom: 18px;
}

.pin-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
}

.pin-container input {
    width: 46px;
    height: 51px;
    border: 1.5px solid #8498aa;
    border-radius: 8px;
    text-align: center;
    font-size: 21px;
    outline: none;
    background: #ffffff;
}

.pin-container input:focus {
    border: 2px solid #2775bc;
    box-shadow: 0 0 4px #a4c8e9;
}

.demo-note {
    margin-top: 15px;
    font-size: 11px;
    color: #888888;
    text-align: center;
    line-height: 1.5;
}

/* BLUE BOTTOM SECTION */

.bottom-section {
    position: relative;
    flex: 0 0 auto;
    width: 100%;
    min-height: 290px;
    background: #2679c3;

    margin-top: 0;
    padding: 75px 22px 24px;

    display: flex;
    flex-direction: column;
    align-items: center;

    color: #ffffff;
    text-align: center;
}

/* SMOOTH INVERTED CURVE */

.bottom-section::before {
    content: "";
    position: absolute;
    width: 125%;
    height: 95px;
    left: -12.5%;
    top: -47px;

    background: #ffffff;
    border-radius: 0 0 50% 50% / 0 0 100% 100%;

    pointer-events: none;
}

.bottom-content {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.bottom-section p {
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 25px;
}

/* BUTTONS */

.buttons {
    width: 100%;
    display: flex;
    gap: 12px;
}

.action-btn {
    flex: 1;
    min-width: 0;
    min-height: 70px;

    border: none;
    border-radius: 10px;

    background: #ffffff;
    color: #777777;

    font-size: 12px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 7px;

    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.action-btn .symbol {
    font-size: 19px;
    font-weight: bold;
    color: #2876b8;
}

/* FOOTER */

.version {
    width: 100%;
    margin-top: auto;
    padding-top: 28px;

    color: #ffffff;
    font-size: 11px;
    line-height: 2;
    text-align: center;
}

.terms {
    color: #ffffff;
    text-decoration: underline;
    pointer-events: none;
    cursor: default;
}

/* SMALL PHONES */

@media (max-width: 360px) {
    .top-section {
        padding-left: 16px;
        padding-right: 16px;
    }

    .logo {
        font-size: 32px;
    }

    .pin-container {
        gap: 7px;
    }

    .pin-container input {
        width: 43px;
        height: 48px;
    }

    .bottom-section {
        padding-left: 16px;
        padding-right: 16px;
    }

    .buttons {
        gap: 9px;
    }
}

/* SHORT SCREENS */

@media (max-height: 680px) {
    .top-section {
        min-height: 390px;
    }

    .logo {
        margin-top: 35px;
        margin-bottom: 22px;
    }

    h3 {
        margin-bottom: 22px;
    }

    .bottom-section {
        min-height: 260px;
        padding-top: 65px;
    }

    .bottom-section::before {
        height: 75px;
        top: -37px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- WHITE SECTION -->

    <div class="top-section">

        <div class="logo">
            <span>My</span><span>Wallet</span>
        </div>

        <h3>Login</h3>

        <!-- PHONE NUMBER -->

        <div class="phone-box">

            <select id="country">

                <option value="+254">🇰🇪 +254</option>
                <option value="+263">🇿🇼 +263</option>
                <option value="+256">🇺🇬 +256</option>
                <option value="+255">🇹🇿 +255</option>
                <option value="+260">🇿🇲 +260</option>
                <option value="+27">🇿🇦 +27</option>

            </select>

            <input
                type="tel"
                id="phone"
                placeholder="Demo Phone Number"
                inputmode="numeric"
                autocomplete="off"
            >

        </div>

        <!-- DEMO ACCESS CODE -->

        <div class="hint">
            Enter your demo access code
        </div>

        <div class="pin-container">

            <input type="password"
                maxlength="1"
                inputmode="numeric"
                autocomplete="off">

            <input type="password"
                maxlength="1"
                inputmode="numeric"
                autocomplete="off">

            <input type="password"
                maxlength="1"
                inputmode="numeric"
                autocomplete="off">

            <input type="password"
                maxlength="1"
                inputmode="numeric"
                autocomplete="off">

        </div>

        <div class="demo-note">
            Demo interface only. Do not enter real account credentials.
        </div>

    </div>


    <!-- BLUE SECTION -->

    <div class="bottom-section">

        <div class="bottom-content">

            <p>
                To explore this wallet demo or get assistance,<br>
                click below
            </p>

            <div class="buttons">

                <!-- INACTIVE REGISTER BUTTON -->

                <button class="action-btn" type="button">
                    <span class="symbol">♟</span>
                    Register
                </button>

                <!-- INACTIVE SUPPORT BUTTON -->

                <button class="action-btn" type="button">
                    <span class="symbol">ⓘ</span>
                    Help & Support
                </button>

            </div>

        </div>

        <!-- FOOTER -->

        <div class="version">

            v1.0 DEMO<br>

            By continuing, you agree to the

            <span class="terms">
                Terms and Conditions
            </span>

        </div>

    </div>

</div>


<!-- DEMO PIN INTERACTIONS -->

<script>

const pinInputs = document.querySelectorAll(
    '.pin-container input'
);

pinInputs.forEach((input, index) => {

    input.addEventListener('input', () => {

        input.value = input.value
            .replace(/\D/g, '')
            .slice(0, 1);

        if (
            input.value &&
            index < pinInputs.length - 1
        ) {
            pinInputs[index + 1].focus();
        }

        if (
            index === pinInputs.length - 1 &&
            input.value
        ) {
            input.blur();
        }

    });

    input.addEventListener('keydown', (event) => {

        if (
            event.key === 'Backspace' &&
            !input.value &&
            index > 0
        ) {
            pinInputs[index - 1].focus();
        }

    });

});

</script>

</body>
</html>
