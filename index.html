<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyWallet</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #2679c3;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wallet {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #2679c3;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top {
      background: white;
      min-height: 61vh;
      padding: 45px 25px 35px;
      border-radius: 0 0 48px 48px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      color: #e32636;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 35px;
    }

    h2 {
      color: #2679c3;
      font-size: 23px;
      margin-bottom: 12px;
    }

    .description {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .pin-label {
      color: #2679c3;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .pin-container {
      width: 100%;
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
    }

    .digit {
      width: 52px;
      height: 58px;
      flex: 0 1 52px;
      border: 1.5px solid #2679c3;
      border-radius: 12px;
      text-align: center;
      font-size: 25px;
      color: #2679c3;
      outline: none;
      background: white;
    }

    .digit:focus {
      border: 2px solid #2679c3;
      box-shadow: 0 0 5px #2679c350;
    }

    .status {
      min-height: 22px;
      font-size: 13px;
      color: #2679c3;
      margin-bottom: 20px;
    }

    .bottom {
      flex: 1;
      padding: 30px 25px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }

    .bottom-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .bottom button {
      border: 1px solid white;
      color: white;
      background: transparent;
      padding: 13px 22px;
      border-radius: 25px;
      font-weight: bold;
      cursor: default;
      pointer-events: none;
    }

    .footer {
      font-size: 12px;
      opacity: .9;
      margin-top: 35px;
    }

    @media (max-width: 350px) {
      .digit {
        width: 45px;
        height: 52px;
      }

      .pin-container {
        gap: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="wallet">

    <section class="top">

      <div class="logo">MyWallet</div>
      <p class="subtitle">Your simple wallet demo</p>

      <h2>Welcome Back</h2>

      <p class="description">
        Enter the four demo digits below to continue.
      </p>

      <p class="pin-label">Demo Access</p>

      <div class="pin-container">
        <input class="digit" type="password" inputmode="numeric"
          maxlength="1" aria-label="Demo digit 1" autocomplete="off">

        <input class="digit" type="password" inputmode="numeric"
          maxlength="1" aria-label="Demo digit 2" autocomplete="off">

        <input class="digit" type="password" inputmode="numeric"
          maxlength="1" aria-label="Demo digit 3" autocomplete="off">

        <input class="digit" type="password" inputmode="numeric"
          maxlength="1" aria-label="Demo digit 4" autocomplete="off">
      </div>

      <div class="status" id="status" aria-live="polite"></div>

    </section>

    <section class="bottom">

      <div>
        <p>Welcome to MyWallet</p>
      </div>

      <div class="bottom-buttons">
        <button type="button" tabindex="-1">Register</button>
        <button type="button" tabindex="-1">Help & Support</button>
      </div>

      <p class="footer">
        Terms and Conditions
      </p>

    </section>

  </main>

  <script>
    const digits = document.querySelectorAll(".digit");
    const status = document.getElementById("status");

    let completed = false;

    digits.forEach((digit, index) => {

      digit.addEventListener("input", () => {
        if (completed) return;

        digit.value = digit.value.replace(/\D/g, "").slice(0, 1);

        if (digit.value && index < digits.length - 1) {
          digits[index + 1].focus();
        }

        const allFilled = [...digits].every(
          input => input.value.length === 1
        );

        if (allFilled) {
          completed = true;
          status.textContent = "Signing you in...";

          // Demo-only: discard the entered digits locally.
          digits.forEach(input => input.value = "");
          digits[0].blur();

          setTimeout(() => {
            status.textContent = "";
            completed = false;
          }, 2000);
        } else {
          status.textContent = "";
        }
      });

      digit.addEventListener("keydown", event => {
        if (
          event.key === "Backspace" &&
          !digit.value &&
          index > 0
        ) {
          digits[index - 1].focus();
        }
      });

      digit.addEventListener("paste", event => {
        event.preventDefault();

        if (completed) return;

        const pasted = event.clipboardData
          .getData("text")
          .replace(/\D/g, "")
          .slice(0, 4);

        pasted.split("").forEach((character, i) => {
          digits[i].value = character;
        });

        if (pasted.length === 4) {
          completed = true;
          status.textContent = "Signing you in...";
          digits.forEach(input => input.value = "");
          digits[0].blur();

          setTimeout(() => {
            status.textContent = "";
            completed = false;
          }, 2000);
        } else {
          digits[Math.min(pasted.length, 3)].focus();
        }
      });

    });
  </script>

</body>
</html>
