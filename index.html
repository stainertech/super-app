<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0875d1">
<title>Wallet Login</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
body{background:#0875d1}
.app{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;width:100%;
  overflow:hidden;color:white;
  background:linear-gradient(160deg,#087bd8,#0063c9)
}
.top{
  height:59%;flex-shrink:0;
  background:#fff;color:#303b42;
  border-radius:0 0 50% 10% / 0 0 9% 5%;
  padding:clamp(28px,7vh,58px) 22px 25px;
  text-align:center
}
.logo{font-size:clamp(29px,8vw,36px);font-weight:800;
  letter-spacing:-1px;margin:0 0 clamp(26px,6vh,43px);
  color:#1769b4}
.logo span{color:#d23d43}
h1{font-size:18px;margin:0 0 20px}
.phone{height:46px;border:1.5px solid #2878b7;border-radius:6px;
  display:flex;align-items:center;gap:9px;padding:0 9px;text-align:left}
.dial{font-size:13px;color:#68727b}
.phone input{width:100%;min-width:0;border:0;outline:0;
  font-size:14px;background:transparent}
.hint{font-size:12px;color:#626c74;margin:10px 0 21px}
.pin{display:flex;justify-content:center;gap:7px}
.pin input{width:clamp(42px,10vw,49px);height:clamp(42px,10vw,49px);
  border:1.4px solid #2878b7;border-radius:7px;text-align:center;
  font-size:22px;color:#1769b4;background:white}
.bottom{flex:1;min-height:0;display:flex;flex-direction:column;
  justify-content:flex-end;padding:12px 22px max(22px,env(safe-area-inset-bottom));
  text-align:center}
.prompt{font-size:12px;line-height:1.5;margin:0 auto 18px}
.actions{display:flex;gap:10px}
.actions button{height:56px;flex:1;border:0;border-radius:9px;
  background:white;color:#0871c9;font-size:12px;cursor:pointer}
.symbol{display:block;font-size:18px;margin-bottom:4px}
.version{font-size:11px;margin:clamp(22px,5vh,42px) 0 8px}
.terms{font-size:11px;line-height:1.4;margin:0;color:#eaf4ff}
.terms a{color:white;text-decoration:underline}
#notice{font-size:12px;min-height:16px;margin:8px 0 0}
@media(max-height:650px){
 .top{height:62%;padding-top:20px}
 .logo{margin-bottom:16px}
 h1{margin-bottom:12px}
 .hint{margin:7px 0 12px}
 .version{margin-top:14px}
 .prompt{margin-bottom:10px}
}
</style>
</head>
<body>
<div class="app">
  <section class="top">
    <div class="logo">Eco<span>Cash</span></div>
    <h1>Login</h1>

    <div class="phone">
      <span>🇿🇼</span>
      <span class="dial">+263</span>
      <input type="tel" inputmode="numeric"
        placeholder="Phone Number" aria-label="Phone number">
    </div>

    <p class="hint">Enter your PIN</p>
    <div class="pin">
      <input aria-label="PIN digit 1" type="password"
        inputmode="numeric" maxlength="1">
      <input aria-label="PIN digit 2" type="password"
        inputmode="numeric" maxlength="1">
      <input aria-label="PIN digit 3" type="password"
        inputmode="numeric" maxlength="1">
      <input aria-label="PIN digit 4" type="password"
        inputmode="numeric" maxlength="1">
    </div>
  </section>

  <section class="bottom">
    <p class="prompt">
      To register for a wallet or get assistance, click below
    </p>

    <div class="actions">
      <button type="button" id="register">
        <span class="symbol">♟</span>Register
      </button>
      <button type="button" id="help">
        <span class="symbol">ⓘ</span>Help &amp; Support
      </button>
    </div>

    <p class="version">Eco Cash</p>
    <p class="terms">
      By continuing, you agree to the
      <a href="#" id="terms">Terms and Conditions</a>
    </p>
    <p id="notice" role="status"></p>
  </section>
</div>

<script>
const pinInputs = [...document.querySelectorAll(".pin input")];

pinInputs.forEach((input, index) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 1);
    if (input.value && pinInputs[index + 1]) {
      pinInputs[index + 1].focus();
    }
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Backspace" &&
        !input.value && pinInputs[index - 1]) {
      pinInputs[index - 1].focus();
    }
  });
});

const notice = document.getElementById("notice");

document.getElementById("register").onclick = () => {
  notice.textContent = "Install Ecocash supper app on playstore and register then comeback and continue with the process";
};

document.getElementById("help").onclick = () => {
  notice.textContent = "Use your provider's official support channel.";
};

document.getElementById("terms").onclick = event => {
  event.preventDefault();
  notice.textContent = "Add your service's terms URL here.";
};
</script>
</body>
</html>
