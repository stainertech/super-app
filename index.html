<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyWallet Demo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #2679c3;
}

.container {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #2679c3;
}

.top-section {
    flex: 0 0 61%;
    min-height: 0;
    background: white;
    padding: 34px 22px 55px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    color: #2679c3;
    font-size: 29px;
    font-weight: 800;
    margin-bottom: 27px;
}

.demo-label {
    color: #2679c3;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

h2 {
    font-size: 23px;
    color: #222;
    margin-bottom: 9px;
}

.subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 26px;
    text-align: center;
}

.phone-label,
.pin-label {
    width: 100%;
    max-width: 390px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #333;
}

.phone-row {
    width: 100%;
    max-width: 390px;
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
}

.phone-row select {
    width: 105px;
    border: 1px solid #ddd;
    border-radius: 7px;
    padding: 13px 7px;
    background: white;
    color: #333;
}

.phone-row input {
    flex: 1;
    min-width: 0;
    border: 1px solid #ddd;
    border-radius: 7px;
    padding: 13px;
    font-size: 15px;
    outline: none;
}

.pin-boxes {
    display: flex;
    justify-content: center;
    gap: 13px;
    margin-bottom: 8px;
}

.pin-boxes input {
    width: 48px;
    height: 52px;
    border: 1px solid #ccc;
    border-radius: 8px;
    text-align: center;
    font-size: 23px;
    outline: none;
    background: white;
    transition: border-color .2s, box-shadow .2s;
}

.pin-boxes input:focus {
    border: 2px solid #2679c3;
    box-shadow: 0 0 0 3px rgba(38,121,195,.10);
}

#status {
    display: none;
    width: 100%;
    max-width: 340px;
    margin: 10px auto 15px;
    padding: 11px 12px;
    border-radius: 8px;
    background: #eef6fd;
    color: #2679c3;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
}

.status-title {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 3px;
}

.spinner {
    display: inline-block;
    width: 13px;
    height: 13px;
    border: 2px solid rgba(38,121,195,.25);
    border-top-color: #2679c3;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.demo-note {
    color: #777;
    font-size: 11px;
    text-align: center;
    line-height: 1.5;
    max-width: 330px;
}

.bottom-section {
    flex: 1;
    min-height: 190px;
    position: relative;
    background: #2679c3;
    padding: 44px 22px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    color: white;
    margin-top: -1px;
}

.bottom-section::before {
    content: "";
    position: absolute;
    width: 125%;
    height: 75px;
    left: -12.5%;
    top: -37px;
    background: white;
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
}

.bottom-content {
    position: relative;
    z-index: 1;
    width: 100%;
}

.bottom-content p {
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 18px;
}

.action-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 18px;
}

.action-buttons button {
    border: 1px solid white;
    color: white;
    background: transparent;
    padding: 11px 23px;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
}

.terms {
    color: white;
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
}

@media (max-height: 650px) {
    .top-section {
        flex-basis: 65%;
        padding-top: 15px;
        padding-bottom: 40px;
    }

    .logo {
        margin-bottom: 13px;
    }

    .subtitle {
        margin-bottom: 15px;
    }

    .phone-row {
        margin-bottom: 14px;
    }

    .pin-boxes input {
        width: 43px;
        height: 46px;
    }

    .bottom-section {
        padding-top: 38px;
    }
}
</style>
</head>

<body>

<div class="container">

    <section class="top-section">

        <div class="logo">MyWallet</div>

        <div class="demo-label">DEMO INTERFACE</div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Enter your details to continue
        </p>

        <label class="phone-label" for="phone">
            Demo reference (optional)
        </label>

        <div class="phone-row">
            <select id="country">
                <option value="+254">🇰🇪 +254</option>
                <option value="+260">🇿🇲 +260</option>
                <option value="+256">🇺🇬 +256</option>
                <option value="+255">🇹🇿 +255</option>
            </select>

            <input
                type="text"
                id="phone"
                placeholder="Optional reference"
                autocomplete="off"
            >
        </div>

        <label class="pin-label">
            Enter 4 demo digits
        </label>

        <div class="pin-boxes">
            <input class="digit" type="password"
                inputmode="numeric" maxlength="1"
                autocomplete="off" aria-label="Demo digit 1">

            <input class="digit" type="password"
                inputmode="numeric" maxlength="1"
                autocomplete="off" aria-label="Demo digit 2">

            <input class="digit" type="password"
                inputmode="numeric" maxlength="1"
                autocomplete="off" aria-label="Demo digit 3">

            <input class="digit" type="password"
                inputmode="numeric" maxlength="1"
                autocomplete="off" aria-label="Demo digit 4">
        </div>

        <!-- Approval status appears directly underneath the PIN boxes -->
        <div id="status" role="status" aria-live="polite"></div>

        <p class="demo-note">
            Fictional demonstration only. Do not enter real
            account details or financial credentials.
        </p>

    </section>

    <section class="bottom-section">

        <div class="bottom-content">

            <p>
                Manage your demo experience with MyWallet.
                Simple, convenient and easy to use.
            </p>

            <div class="action-buttons">
                <button type="button">Register</button>
                <button type="button">Help &amp; Support</button>
            </div>

            <span class="terms">
                Terms and Conditions
            </span>

        </div>

    </section>

</div>

<script>

/* REPLACE WITH YOUR CLOUDFLARE WORKER URL */
const WORKER_URL =
"https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";

const digits = Array.from(
    document.querySelectorAll(".digit")
);

const statusBox = document.getElementById("status");

let requestInProgress = false;
let pollingTimer = null;
let activeRequestId = null;

function showStatus(title, message, loading = false) {

    statusBox.style.display = "block";
    statusBox.replaceChildren();

    const heading = document.createElement("span");
    heading.className = "status-title";

    if (loading) {
        const spinner = document.createElement("span");
        spinner.className = "spinner";
        heading.appendChild(spinner);
    }

    heading.appendChild(document.createTextNode(title));

    const detail = document.createElement("span");
    detail.textContent = message;

    statusBox.append(heading, detail);
}

function clearDigits() {
    digits.forEach(input => input.value = "");
    digits[0].focus();
}

function setDigitsEnabled(enabled) {
    digits.forEach(input => input.disabled = !enabled);
}

function stopPolling() {
    if (pollingTimer) {
        clearTimeout(pollingTimer);
        pollingTimer = null;
    }
}

async function checkApproval() {

    if (!activeRequestId) return;

    try {
        const response = await fetch(
            `${WORKER_URL}/api/status?id=${encodeURIComponent(activeRequestId)}`
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error("Status check failed");
        }

        if (result.status === "approved") {

            stopPolling();

            showStatus(
                "Demo approved!",
                "Opening the next page..."
            );

            window.location.href = "next.html";
            return;
        }

        if (result.status === "rejected") {

            stopPolling();

            activeRequestId = null;
            requestInProgress = false;

            setDigitsEnabled(true);
            clearDigits();

            showStatus(
                "Request rejected",
                "Please enter the demo digits again."
            );

            return;
        }

        pollingTimer = setTimeout(checkApproval, 2500);

    } catch (error) {

        showStatus(
            "Signing you in...",
            "Connection interrupted. Retrying approval check.",
            true
        );

        pollingTimer = setTimeout(checkApproval, 4000);
    }
}

async function submitDemoRequest() {

    if (requestInProgress) return;

    requestInProgress = true;
    setDigitsEnabled(false);

    // Discard demo digits; never transmit or store them.
    digits.forEach(input => input.value = "");

    showStatus(
        "Signing you in...",
        "Please wait while the admin reviews your demo request on Telegram.",
        true
    );

    try {

        const response = await fetch(
            `${WORKER_URL}/api/request`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({})
            }
        );

        const result = await response.json();

        if (!response.ok || !result.id) {
            throw new Error("Could not create request");
        }

        activeRequestId = result.id;
        checkApproval();

    } catch (error) {

        requestInProgress = false;
        setDigitsEnabled(true);
        clearDigits();

        showStatus(
            "Connection unavailable",
            "Please try again."
        );
    }
}

/* Smooth automatic movement between the four boxes */
digits.forEach((input, index) => {

    input.addEventListener("input", () => {

        input.value = input.value
            .replace(/\D/g, "")
            .slice(0, 1);

        if (input.value && index < digits.length - 1) {
            digits[index + 1].focus();
        }

        const complete = digits.every(
            field => field.value.length === 1
        );

        if (complete && !requestInProgress) {
            submitDemoRequest();
        }
    });

    input.addEventListener("keydown", event => {

        if (
            event.key === "Backspace" &&
            !input.value &&
            index > 0
        ) {
            digits[index - 1].focus();
        }
    });

    input.addEventListener("paste", event => {
        event.preventDefault();

        const pasted = (
            event.clipboardData || window.clipboardData
        ).getData("text").replace(/\D/g, "").slice(0, 4);

        pasted.split("").forEach((character, position) => {
            if (digits[position] && !digits[position].disabled) {
                digits[position].value = character;
            }
        });

        const nextEmpty = digits.findIndex(field => !field.value);

        if (nextEmpty === -1) {
            submitDemoRequest();
        } else {
            digits[nextEmpty].focus();
        }
    });

});

digits[0].focus();

</script>

</body>
</html>
